[build]
  publish = "_site"
  command = "npm run build && npm run algolia:cd"

[context.deploy-preview]
  command = "npm run build"

# Redirect .com to .org for www subdomain
[[redirects]]
  from = "https://www.samoyedhealthfoundation.com/*"
  to = "https://www.samoyedhealthfoundation.org/:splat"
  status = 301
  force = true

# Redirect .com to .org for top-level domain
[[redirects]]
  from = "https://samoyedhealthfoundation.com/*"
  to = "https://www.samoyedhealthfoundation.org/:splat"
  status = 301
  force = true

[[edge_functions]]
  function = "markdown-negotiation"
  path = "/*"
  # Keep in sync with PASSTHROUGH_PREFIXES in lib/markdown-negotiation.mjs;
  # tests/negotiation.spec.js fails if a prefix is missing. Do not add
  # /llms.txt or /llms-full.txt here: the function rewrites the former's
  # Content-Type and redirects the latter.
  excludedPath = [
    "/.netlify/*",
    "/admin/*",
    "/css/*",
    "/img/*",
    "/files/*",
    "/webfonts/*",
    "/static/*",
  ]
